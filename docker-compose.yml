version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - ./server/database.db:/app/database.db
      - ./server/database.sql:/app/database.sql
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.client
    ports:
      - "3000:80"
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=http://localhost:8080